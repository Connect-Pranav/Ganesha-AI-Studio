<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Foliocraft — original mark: an "F" built from stacked portfolio pages inside a glowing ring. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#0f2a3d"/>
      <stop offset="60%" stop-color="#071624"/>
      <stop offset="100%" stop-color="#030a12"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ef2d6"/>
      <stop offset="50%" stop-color="#36b7ff"/>
      <stop offset="100%" stop-color="#7b6cff"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfefff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ef2d6"/>
      <stop offset="100%" stop-color="#36b7ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <circle cx="500" cy="500" r="480" fill="url(#bg)"/>
  <circle cx="500" cy="500" r="452" fill="none" stroke="url(#ring)" stroke-width="12" filter="url(#glow)"/>

  <!-- faint grid, like a layout canvas -->
  <g stroke="#36b7ff" stroke-opacity="0.08" stroke-width="2">
    <line x1="200" y1="300" x2="800" y2="300"/><line x1="160" y1="420" x2="840" y2="420"/>
    <line x1="160" y1="540" x2="840" y2="540"/><line x1="200" y1="660" x2="800" y2="660"/>
    <line x1="320" y1="150" x2="320" y2="760"/><line x1="680" y1="150" x2="680" y2="760"/>
  </g>

  <!-- back pages (the "folio") -->
  <g filter="url(#soft)">
    <rect x="404" y="214" width="250" height="330" rx="26" fill="#7b6cff" opacity="0.55" transform="rotate(10 529 379)"/>
    <rect x="384" y="204" width="250" height="330" rx="26" fill="#36b7ff" opacity="0.7" transform="rotate(4 509 369)"/>
  </g>

  <!-- front page carrying the F -->
  <g filter="url(#soft)">
    <rect x="356" y="196" width="260" height="344" rx="28" fill="url(#page)"/>
  </g>
  <!-- F built from layout blocks -->
  <rect x="400" y="240" width="40" height="256" rx="12" fill="#071624"/>
  <rect x="400" y="240" width="176" height="44" rx="12" fill="url(#bar)"/>
  <rect x="400" y="340" width="132" height="40" rx="12" fill="url(#bar)"/>
  <rect x="470" y="420" width="106" height="16" rx="8" fill="#071624" opacity="0.18"/>
  <rect x="470" y="450" width="80" height="16" rx="8" fill="#071624" opacity="0.18"/>
  <rect x="470" y="480" width="96" height="16" rx="8" fill="#071624" opacity="0.18"/>

  <!-- craft spark -->
  <path d="M664 196 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z" fill="#5ef2d6" filter="url(#glow)"/>

  <!-- wordmark -->
  <text x="500" y="680" text-anchor="middle" font-family="Mona Sans, Inter, Arial, sans-serif" font-weight="800" font-size="104" letter-spacing="6" fill="#ffffff">FOLIOCRAFT</text>
  <line x1="300" y1="722" x2="700" y2="722" stroke="url(#ring)" stroke-width="4" stroke-linecap="round"/>
  <text x="500" y="780" text-anchor="middle" font-family="Mona Sans, Inter, Arial, sans-serif" font-weight="600" font-size="36" letter-spacing="10" fill="#9fdcff">CRAFT YOUR STORY</text>
</svg>
