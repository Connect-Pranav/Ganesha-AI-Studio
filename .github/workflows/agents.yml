name: Agents (Gemini engine)

# NARADA researches, then GANESHA plans. Runs daily and on demand.
# Needs repo secret GEMINI_API_KEY (free key from Google AI Studio).
# Optional repo variable GEMINI_MODEL (default gemini-3.8-flash).
# Without the secret the run exits cleanly and writes nothing.

on:
  schedule:
    - cron: '23 0 * * *' # 05:53 IST daily
  workflow_dispatch:
    inputs:
      agent:
        description: Which agent to run
        type: choice
        options: [all, narada, ganesha]
        default: all

permissions:
  contents: write

concurrency:
  group: agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Exit code 2 = an agent run was recorded as failed. Capture it so the failure record
      # is still validated and committed, then fail the job in the last step (red run + email).
      - name: Run agents
        id: agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          set +e
          node scripts/agent-runner.mjs --agent "${{ github.event.inputs.agent || 'all' }}"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::agent-runner crashed with exit code $code"
            exit "$code"
          fi

      - name: Validate agent data
        run: node scripts/validate.mjs

      - name: Commit results
        run: |
          if git diff --quiet -- public/agent-data; then
            echo "No new agent data."
            exit 0
          fi
          git config user.name "ganesha-agents[bot]"
          git config user.email "ganesha-agents@users.noreply.github.com"
          git add public/agent-data
          git commit -m "agents: gemini run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail if an agent run failed
        if: steps.agents.outputs.exit_code == '2'
        run: |
          echo "::error::One or more agent runs failed — see the run record in public/agent-data/runs.json and the log above."
          exit 1
